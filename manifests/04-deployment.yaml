apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-pv-writer-app2
  namespace: nfs-static-pv-demo-app2
  labels:
    app.kubernetes.io/name: nfs-pv-writer-app2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-pv-writer-app2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-pv-writer-app2
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/python-312:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/app/server.py
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app-code
              mountPath: /opt/app
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: app-code
          configMap:
            name: nfs-pv-writer-app2-code
        - name: data
          persistentVolumeClaim:
            claimName: static-nfs-pvc-demo-app2
