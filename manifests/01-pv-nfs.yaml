apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-nfs-pv-demo-app2
  labels:
    storage-type: nfs
    migration-group: nfs-server-migration
    app.kubernetes.io/name: nfs-pv-writer-app2
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nfs-static-pv-demo-app2
    name: static-nfs-pvc-demo-app2
  nfs:
    server: 10.10.74.178
    path: /exports/ocp-static-nfs-pv-demo-app2
